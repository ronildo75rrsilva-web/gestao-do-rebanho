<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f4d36">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rebanho">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23d98e04'/><text x='50' y='70' font-size='62' text-anchor='middle'>🐂</text></svg>">
<title>Gestão do Rebanho</title>
<style>
:root{
  --verde:#1f4d36;--verde2:#2f7d4f;--verde3:#e8f3ec;--ambar:#d98e04;--vermelho:#c0392b;--azul:#2563eb;
  --fundo:#f3f5f2;--card:#ffffff;--texto:#1d2a22;--suave:#6b7a70;--borda:#e2e8e3;--sombra:0 1px 3px rgba(16,40,25,.08),0 4px 14px rgba(16,40,25,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--fundo);color:var(--texto);font-size:14px;display:flex;min-height:100vh}
button{font-family:inherit;cursor:pointer}
/* Sidebar */
.sidebar{width:240px;background:linear-gradient(180deg,#173b29,#1f4d36);color:#dfeee5;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:30;overflow-y:auto}
.brand{padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:#fff}
.brand .logo span.ic{width:36px;height:36px;border-radius:10px;background:#d98e04;display:grid;place-items:center;font-size:20px}
.brand small{display:block;margin-top:6px;color:#9fc3ad;font-size:12px}
.nav{padding:14px 10px;flex:1}
.nav button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;color:#cfe3d6;padding:11px 14px;border-radius:9px;font-size:14px;text-align:left;margin-bottom:3px}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.active{background:#2f7d4f;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.nav .badge{margin-left:auto;background:#c0392b;color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
.nav .sep{height:1px;background:rgba(255,255,255,.08);margin:8px 6px}
.side-foot{padding:14px 20px;font-size:11px;color:#8fb39d;border-top:1px solid rgba(255,255,255,.08)}
.scrim{display:none}
/* Main */
.main{margin-left:240px;flex:1;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--borda);padding:16px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
.topbar h1{font-size:20px;font-weight:600}
.topbar .sub{color:var(--suave);font-size:13px}
.topbar .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.menu-btn{display:none!important;font-size:18px}
.sync-ico{font-size:12px;color:var(--suave);white-space:nowrap}
.content{padding:24px 28px 40px}
.btn{border:1px solid var(--borda);background:#fff;color:var(--texto);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{background:#f6f8f6;border-color:#cdd8d0}
.btn.primary{background:var(--verde2);border-color:var(--verde2);color:#fff}
.btn.primary:hover{background:#276b43}
.btn.danger{color:var(--vermelho)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.icon{padding:5px 8px}
/* Cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:20px}
.kpi{background:var(--card);border-radius:12px;padding:18px;box-shadow:var(--sombra);border:1px solid var(--borda);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--verde2))}
.kpi .lbl{color:var(--suave);font-size:12px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.kpi .val{font-size:26px;font-weight:700;margin:6px 0 2px}
.kpi .val small{font-size:14px;font-weight:500;color:var(--suave)}
.kpi .det{font-size:12px;color:var(--suave)}
.kpi .ico{position:absolute;right:14px;top:14px;font-size:22px;opacity:.85}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:2fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g11{grid-template-columns:1fr 1fr}
@media(max-width:1100px){.g2,.g3,.g11{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:12px;box-shadow:var(--sombra);border:1px solid var(--borda);padding:18px;min-width:0}
.card h3{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .r{margin-left:auto;font-weight:400;font-size:12px;color:var(--suave)}
canvas{width:100%;height:260px;display:block}
canvas.sm{height:220px}
/* Tables */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select{padding:8px 11px;border:1px solid var(--borda);border-radius:8px;font-size:13px;background:#fff;font-family:inherit}
.toolbar input[type=search]{min-width:240px}
.toolbar .count{margin-left:auto;color:var(--suave);font-size:13px}
.tbl-wrap{overflow:auto;background:#fff;border-radius:12px;border:1px solid var(--borda);box-shadow:var(--sombra)}
table{width:100%;border-collapse:collapse}
th{background:#f7f9f7;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--suave);font-weight:600;padding:11px 12px;border-bottom:1px solid var(--borda);white-space:nowrap;position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid #eef2ef;white-space:nowrap}
tr:hover td{background:#fafcfa}
td.acts{text-align:right}
td.num,th.num{text-align:right}
.empty{padding:40px;text-align:center;color:var(--suave)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.t-verde{background:#e3f4e9;color:#1e7442}.t-ambar{background:#fdf1d8;color:#9a6200}.t-verm{background:#fbe4e1;color:#a52a1d}.t-azul{background:#e2ebfd;color:#1d4ed8}.t-cinza{background:#eef1ef;color:#5b6860}.t-roxo{background:#efe7fb;color:#6b3fb8}
.brinco{font-weight:700;color:var(--verde)}
.link{color:var(--verde2);cursor:pointer;font-weight:600}
.link:hover{text-decoration:underline}
.pos{color:#1e7442;font-weight:600}.neg{color:var(--vermelho);font-weight:600}
/* Alerts list */
.alist{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto}
.aitem{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:#fafbfa;border:1px solid #eef2ef}
.aitem .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
.aitem b{font-weight:600}
.aitem .m{font-size:12px;color:var(--suave)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.stats div{background:#f7f9f7;border-radius:9px;padding:10px;text-align:center}
.stats b{display:block;font-size:20px}
.stats span{font-size:11px;color:var(--suave);text-transform:uppercase;font-weight:600}
/* Timeline */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--borda)}
.tl{position:relative;margin-bottom:14px;background:#fff;border:1px solid var(--borda);border-radius:10px;padding:12px 14px;box-shadow:var(--sombra)}
.tl::before{content:"";position:absolute;left:-20px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--verde2));border:2px solid #fff;box-shadow:0 0 0 2px var(--c,var(--verde2))}
.tl .h{display:flex;gap:8px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.tl .h .d{color:var(--suave);font-size:12px}
.tl .h .x{margin-left:auto}
.tl p{white-space:pre-wrap;line-height:1.45}
/* Pastures */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.pcard h4{font-size:16px;margin-bottom:4px}
.pcard .info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;font-size:13px}
.pcard .info div span{display:block;color:var(--suave);font-size:11px;text-transform:uppercase}
.bar{height:8px;background:#edf1ee;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--verde2);border-radius:5px}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(15,30,20,.45);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow:auto;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .15s ease-out}
.modal.lg{max-width:980px}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
.modal .mh{padding:16px 22px;border-bottom:1px solid var(--borda);display:flex;align-items:center}
.modal .mh h2{font-size:17px}
.modal .mh button{margin-left:auto;border:0;background:none;font-size:22px;color:var(--suave)}
.modal .mb{padding:20px 22px;max-height:calc(100vh - 220px);overflow:auto}
.modal .mf{padding:14px 22px;border-top:1px solid var(--borda);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg.full{grid-column:1/-1}
.fg label{font-size:12px;font-weight:600;color:#3e4d43}
.fg label .req{color:var(--vermelho)}
.fg input,.fg select,.fg textarea{padding:9px 11px;border:1px solid #d4ddd6;border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--verde2);box-shadow:0 0 0 3px rgba(47,125,79,.15)}
.fg textarea{min-height:80px;resize:vertical}
.fg .hint{font-size:11.5px;color:var(--suave)}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.dgrid div{background:#f7f9f7;border-radius:9px;padding:10px 12px}
.dgrid span{display:block;font-size:11px;color:var(--suave);text-transform:uppercase;font-weight:600}
.dgrid b{font-size:15px}
.sec-t{font-size:14px;font-weight:600;margin:18px 0 8px}
.toast{position:fixed;bottom:24px;right:24px;background:#1f4d36;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:200;animation:pop .2s}
.welcome{text-align:center;padding:50px 20px}
.welcome .big{font-size:56px}
.welcome h2{margin:10px 0 6px}
.welcome p{color:var(--suave);margin-bottom:18px}
.lote-tbl input[type=number]{width:110px;padding:6px 8px;border:1px solid #d4ddd6;border-radius:6px}
.lote-tbl select{padding:6px 8px;border:1px solid #d4ddd6;border-radius:6px}
.lote-tbl input[type=checkbox]{width:18px;height:18px}
details.guia{margin-top:16px;border:1px solid var(--borda);border-radius:10px;padding:12px 14px;background:#fafbfa}
details.guia summary{cursor:pointer;font-weight:600}
details.guia ol{margin:10px 0 6px 20px;line-height:1.7}
details.guia pre{background:#1d2a22;color:#d9f0e1;padding:12px;border-radius:8px;overflow:auto;font-size:12px;margin:8px 0}
@media print{
  .sidebar,.topbar .actions,.toolbar,td.acts,th.acts,.sync-ico{display:none!important}
  .main{margin:0}.content{padding:0}body{background:#fff}
  .card,.kpi,.tbl-wrap{box-shadow:none}
}
/* Celular */
@media(max-width:860px){
  .sidebar{transform:translateX(-100%);transition:transform .2s;width:260px;box-shadow:0 0 40px rgba(0,0,0,.3)}
  body.menu .sidebar{transform:none}
  body.menu .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  .main{margin-left:0}
  .menu-btn{display:inline-flex!important}
  .topbar{padding:10px 14px;flex-wrap:wrap;gap:8px 12px}
  .topbar h1{font-size:18px}
  .topbar .actions{margin-left:0;width:100%}
  .topbar .actions .btn{flex:1 1 auto;justify-content:center}
  .content{padding:14px 12px 30px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:13px}.kpi .val{font-size:20px}.kpi .ico{font-size:17px;right:10px;top:10px}
  .form-grid{grid-template-columns:1fr}
  .dgrid{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:1fr 1fr}
  .ov{padding:0}.modal,.modal.lg{border-radius:0;min-height:100vh;max-width:none}.modal .mb{max-height:none}
  .toolbar input[type=search]{min-width:0;flex:1 1 100%}
  .toolbar select{flex:1 1 40%}
  .fg input,.fg select,.fg textarea,.toolbar input,.toolbar select{font-size:16px}
  .toast{left:12px;right:12px;bottom:12px}
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <div class="logo"><span class="ic">🐂</span><span class="t">Gestão do Rebanho</span></div>
    <small id="nomeFazenda">Minha Fazenda</small>
  </div>
  <nav class="nav" id="nav">
    <button data-v="dashboard"><span>📊</span><span class="t">Painel</span></button>
    <button data-v="animais"><span>🐄</span><span class="t">Rebanho</span></button>
    <button data-v="pesagens"><span>⚖️</span><span class="t">Pesagens</span></button>
    <button data-v="sanidade"><span>💉</span><span class="t">Sanidade</span><span class="badge" id="bdgSan" style="display:none"></span></button>
    <button data-v="reproducao"><span>🐮</span><span class="t">Reprodução</span><span class="badge" id="bdgRep" style="display:none"></span></button>
    <button data-v="financeiro"><span>💰</span><span class="t">Financeiro</span><span class="badge" id="bdgFin" style="display:none"></span></button>
    <button data-v="diario"><span>📝</span><span class="t">Diário</span></button>
    <button data-v="pastos"><span>🌾</span><span class="t">Pastos</span></button>
    <div class="sep"></div>
    <button data-v="config"><span>⚙️</span><span class="t">Configurações</span></button>
  </nav>
  <div class="side-foot" id="syncSt">Dados salvos neste aparelho.<br>Faça backup regularmente.</div>
</aside>
<div class="scrim" onclick="document.body.classList.remove('menu')"></div>

<main class="main">
  <header class="topbar">
    <button class="btn icon menu-btn" onclick="document.body.classList.toggle('menu')">☰</button>
    <div><h1 id="ttl">Painel</h1><div class="sub" id="sub"></div></div>
    <span class="sync-ico" id="syncIco"></span>
    <div class="actions" id="acts"></div>
  </header>
  <section class="content" id="app"></section>
</main>

<script>
/* ===================== DADOS ===================== */
const KEY='gestao_rebanho_v1';
const COLS=['animals','weighings','health','events','pastures','finance','repro','stations'];
function blank(){return{config:{fazenda:'Minha Fazenda',rendimento:52,precoArroba:310,diasAlertaPesagem:30,diasAlertaSanidade:15},animals:[],weighings:[],health:[],events:[],pastures:[],finance:[],repro:[],stations:[],deleted:{}};}
function normalize(d){const b=blank();const o=Object.assign(b,d||{});o.config=Object.assign(blank().config,(d&&d.config)||{});COLS.forEach(c=>{if(!Array.isArray(o[c]))o[c]=[];});if(!o.deleted||typeof o.deleted!=='object')o.deleted={};return o;}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d)return normalize(d);}catch(e){}return blank();}
let db=load();

/* Cada registro alterado recebe o carimbo _u, usado para mesclar dados entre aparelhos */
let snap={};
const strip=r=>{const{_u,...x}=r;return JSON.stringify(x);};
function snapshot(){snap={};COLS.forEach(c=>db[c].forEach(r=>snap[r.id]=strip(r)));snap.__cfg=strip(db.config);}
snapshot();
function save(){
  const now=Date.now();const seen=new Set();
  COLS.forEach(c=>db[c].forEach(r=>{seen.add(r.id);if(snap[r.id]!==strip(r))r._u=now;}));
  Object.keys(snap).forEach(id=>{if(id!=='__cfg'&&!seen.has(id))db.deleted[id]=now;});
  if(snap.__cfg!==strip(db.config))db.config._u=now;
  localStorage.setItem(KEY,JSON.stringify(db));snapshot();updateBadges();schedSync();
}

/* ===================== UTIL ===================== */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
const days=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const fd=iso=>iso?iso.split('-').reverse().join('/'):'—';
const nf=(v,d=0)=>v==null||isNaN(v)?'—':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const money2=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const kfmt=v=>{const a=Math.abs(v);return a>=1e6?nf(v/1e6,1)+' mi':a>=1e3?nf(v/1e3,a>=1e4?0:1)+' mil':nf(v,0);};
const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const byBrinco=(a,b)=>a.brinco.localeCompare(b.brinco,'pt',{numeric:true});
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800);}

const animal=id=>db.animals.find(a=>a.id===id);
const pasture=id=>db.pastures.find(p=>p.id===id);
const pastoNome=id=>pasture(id)?.nome||'—';
const ativos=()=>db.animals.filter(a=>a.status==='Ativo');
const animalLabel=a=>a?`${a.brinco}${a.nome?' – '+a.nome:''}`:'(removido)';

function weightsOf(id){
  const a=animal(id);const l=db.weighings.filter(w=>w.animalId===id).map(w=>({data:w.data,peso:+w.peso,id:w.id}));
  if(a&&a.pesoEntrada&&a.dataEntrada&&!l.some(w=>w.data===a.dataEntrada))l.push({data:a.dataEntrada,peso:+a.pesoEntrada,entrada:true});
  return l.sort((x,y)=>x.data.localeCompare(y.data));
}
const lastW=id=>{const l=weightsOf(id);return l[l.length-1]||null;};
function gmd(id){const l=weightsOf(id);if(l.length<2)return null;const a=l[0],b=l[l.length-1];const d=days(a.data,b.data);return d>0?(b.peso-a.peso)/d:null;}
function gmdRecente(id){const l=weightsOf(id);if(l.length<2)return null;const a=l[l.length-2],b=l[l.length-1];const d=days(a.data,b.data);return d>0?(b.peso-a.peso)/d:null;}
function idadeMeses(a){if(!a.nasc)return null;return Math.floor(days(a.nasc,today())/30.44);}
function idadeTxt(a){const m=idadeMeses(a);if(m==null)return '—';if(m<24)return m+' m';const y=Math.floor(m/12),r=m%12;return y+'a'+(r?' '+r+'m':'');}
function categoria(a){const m=idadeMeses(a);if(m==null)return '—';const f=a.sexo==='Fêmea';if(m<12)return f?'Bezerra':'Bezerro';if(m<24)return f?'Novilha':'Garrote';return f?'Vaca':(a.castrado==='Sim'?'Boi':'Touro');}
const statusTag=s=>`<span class="tag ${s==='Ativo'?'t-verde':s==='Vendido'?'t-azul':s==='Morto'?'t-verm':'t-cinza'}">${esc(s)}</span>`;
const gmdHtml=v=>v==null?'<span style="color:#9aa">—</span>':`<span class="${v>=0?'pos':'neg'}">${nf(v,3)}</span>`;

/* Alertas sanitários: registros com próxima dose ainda não realizada */
function pendSanitarias(){
  const lim=addDays(today(),+db.config.diasAlertaSanidade||15);
  const res=db.health.filter(h=>{
    if(!h.proxima||h.proxima>lim)return false;
    const a=animal(h.animalId);if(!a||a.status!=='Ativo')return false;
    return !db.health.some(o=>o!==h&&o.animalId===h.animalId&&o.produto.trim().toLowerCase()===h.produto.trim().toLowerCase()&&o.data>h.data);
  });
  const g={};res.forEach(h=>{const k=h.produto+'|'+h.proxima;(g[k]=g[k]||{produto:h.produto,tipo:h.tipo,proxima:h.proxima,animais:[]}).animais.push(h.animalId);});
  return Object.values(g).sort((a,b)=>a.proxima.localeCompare(b.proxima));
}

const PAL=['#2f7d4f','#d98e04','#2563eb','#c0392b','#7c3aed','#0891b2','#65a30d','#db2777','#64748b','#a16207','#0f766e','#9333ea'];
function cv(c){const dpr=window.devicePixelRatio||1;const w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,w,h);x.font='12px Segoe UI';return{x,w,h};}
function noData(x,w,h,m='Sem dados suficientes'){x.fillStyle='#9aa8a0';x.textAlign='center';x.font='13px Segoe UI';x.fillText(m,w/2,h/2);}
function lineChart(c,labels,vals,{color='#2f7d4f',unit=''}={}){
  if(!c)return;const{x,w,h}=cv(c);const pts=vals.map((v,i)=>[i,v]).filter(p=>p[1]!=null&&!isNaN(p[1]));if(!pts.length)return noData(x,w,h);
  const P={l:50,r:16,t:16,b:30};let mn=Math.min(...pts.map(p=>p[1])),mx=Math.max(...pts.map(p=>p[1]));if(mn===mx){mn-=10;mx+=10;}const r=mx-mn;mn-=r*.12;mx+=r*.12;
  const n=labels.length;const X=i=>P.l+(n===1?(w-P.l-P.r)/2:i*(w-P.l-P.r)/(n-1));const Y=v=>P.t+(1-(v-mn)/(mx-mn))*(h-P.t-P.b);
  x.strokeStyle='#edf1ee';x.fillStyle='#8a988f';x.textAlign='right';x.lineWidth=1;
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=Y(v);x.beginPath();x.moveTo(P.l,y);x.lineTo(w-P.r,y);x.stroke();x.fillText(nf(v,0)+unit,P.l-6,y+4);}
  x.textAlign='center';const step=Math.ceil(n/Math.max(1,Math.floor((w-P.l)/60)));labels.forEach((l,i)=>{if(i%step===0||i===n-1)x.fillText(l,X(i),h-10);});
  const g=x.createLinearGradient(0,P.t,0,h-P.b);g.addColorStop(0,color+'40');g.addColorStop(1,color+'00');
  x.beginPath();pts.forEach((p,i)=>i?x.lineTo(X(p[0]),Y(p[1])):x.moveTo(X(p[0]),Y(p[1])));x.lineTo(X(pts[pts.length-1][0]),h-P.b);x.lineTo(X(pts[0][0]),h-P.b);x.closePath();x.fillStyle=g;x.fill();
  x.beginPath();pts.forEach((p,i)=>i?x.lineTo(X(p[0]),Y(p[1])):x.moveTo(X(p[0]),Y(p[1])));x.strokeStyle=color;x.lineWidth=2.5;x.lineJoin='round';x.stroke();
  pts.forEach(p=>{x.beginPath();x.arc(X(p[0]),Y(p[1]),4,0,7);x.fillStyle='#fff';x.fill();x.lineWidth=2;x.stroke();});
}
function roundBar(x,cx,bw,y,base,r){r=Math.max(0,Math.min(r,bw/2,base-y));x.beginPath();x.moveTo(cx-bw/2,base);x.lineTo(cx-bw/2,y+r);x.quadraticCurveTo(cx-bw/2,y,cx-bw/2+r,y);x.lineTo(cx+bw/2-r,y);x.quadraticCurveTo(cx+bw/2,y,cx+bw/2,y+r);x.lineTo(cx+bw/2,base);x.fill();}
function barChart(c,labels,vals,{colors=PAL,unit=''}={}){
  if(!c)return;const{x,w,h}=cv(c);if(!vals.length||vals.every(v=>!v))return noData(x,w,h);
  const P={l:40,r:10,t:22,b:34};const mx=Math.max(...vals)*1.15||1;const n=vals.length;const bw=Math.min(56,(w-P.l-P.r)/n*.6);
  x.strokeStyle='#edf1ee';x.fillStyle='#8a988f';x.textAlign='right';
  for(let i=0;i<=4;i++){const v=mx*i/4,y=P.t+(1-i/4)*(h-P.t-P.b);x.beginPath();x.moveTo(P.l,y);x.lineTo(w-P.r,y);x.stroke();x.fillText(nf(v,0),P.l-6,y+4);}
  vals.forEach((v,i)=>{const cx=P.l+(i+.5)*(w-P.l-P.r)/n;const bh=(v/mx)*(h-P.t-P.b);const y=h-P.b-bh;
    x.fillStyle=colors[i%colors.length];roundBar(x,cx,bw,y,h-P.b,6);
    x.fillStyle='#1d2a22';x.textAlign='center';x.font='600 12px Segoe UI';x.fillText(nf(v,0)+unit,cx,y-6);x.font='12px Segoe UI';
    x.fillStyle='#5b6860';let l=labels[i];const maxW=(w-P.l-P.r)/n-4;while(x.measureText(l).width>maxW&&l.length>3)l=l.slice(0,-2);if(l!==labels[i])l+='…';x.fillText(l,cx,h-14);});
}
function groupBars(c,labels,series){
  if(!c)return;const{x,w,h}=cv(c);const all=series.flatMap(s=>s.values);if(!all.some(v=>v))return noData(x,w,h);
  const P={l:58,r:10,t:30,b:28};const mx=Math.max(...all)*1.1||1;const n=labels.length;const gw=(w-P.l-P.r)/n;const bw=Math.min(18,gw*.8/series.length);
  x.strokeStyle='#edf1ee';x.fillStyle='#8a988f';x.textAlign='right';
  for(let i=0;i<=4;i++){const v=mx*i/4,y=P.t+(1-i/4)*(h-P.t-P.b);x.beginPath();x.moveTo(P.l,y);x.lineTo(w-P.r,y);x.stroke();x.fillText(kfmt(v),P.l-6,y+4);}
  labels.forEach((l,i)=>{const gx=P.l+i*gw+gw/2;series.forEach((s,k)=>{const v=s.values[i]||0;const bh=v/mx*(h-P.t-P.b);const cx=gx+(k-(series.length-1)/2)*bw;x.fillStyle=s.color;if(bh>0)roundBar(x,cx,bw-2,h-P.b-bh,h-P.b,4);});});
  x.fillStyle='#5b6860';x.textAlign='center';const step=Math.ceil(n/Math.max(1,Math.floor((w-P.l)/48)));labels.forEach((l,i)=>{if(i%step===0)x.fillText(l,P.l+i*gw+gw/2,h-10);});
  let lx=P.l;x.textAlign='left';series.forEach(s=>{x.fillStyle=s.color;x.fillRect(lx,8,12,12);x.fillStyle='#1d2a22';x.fillText(s.name,lx+17,18);lx+=x.measureText(s.name).width+36;});
}
function donut(c,labels,vals,{colors=PAL,center,sub='animais',fmt=v=>v}={}){
  if(!c)return;const{x,w,h}=cv(c);const tot=vals.reduce((a,b)=>a+b,0);if(!tot)return noData(x,w,h);
  const R=Math.min(h/2-12,w/4.2);const cx=R+12,cy=h/2;let a=-Math.PI/2;
  vals.forEach((v,i)=>{const s=v/tot*Math.PI*2;x.beginPath();x.moveTo(cx,cy);x.arc(cx,cy,R,a,a+s);x.closePath();x.fillStyle=colors[i%colors.length];x.fill();a+=s;});
  x.beginPath();x.arc(cx,cy,R*.6,0,7);x.fillStyle='#fff';x.fill();
  x.fillStyle='#1d2a22';x.textAlign='center';x.font='700 20px Segoe UI';x.fillText(center??tot,cx,cy+4);x.font='11px Segoe UI';x.fillStyle='#8a988f';x.fillText(sub,cx,cy+20);
  x.textAlign='left';const lx=cx+R+18;const show=labels.slice(0,8);let ly=cy-(show.length*21)/2+10;
  show.forEach((l,i)=>{x.fillStyle=colors[i%colors.length];x.fillRect(lx,ly-9,11,11);x.font='12px Segoe UI';let t=l;while(x.measureText(t).width>w-lx-90&&t.length>4)t=t.slice(0,-2);if(t!==l)t+='…';x.fillStyle='#1d2a22';x.fillText(t,lx+16,ly+1);x.fillStyle='#8a988f';x.fillText(`${fmt(vals[i])} (${nf(vals[i]/tot*100,0)}%)`,lx+16+x.measureText(t).width+6,ly+1);ly+=21;});
}
let charts=[];
function drawCharts(){charts.forEach(f=>f());}

function modal(title,html,buttons=[{label:'Fechar'}],size=''){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="modal ${size}"><div class="mh"><h2>${esc(title)}</h2><button title="Fechar">×</button></div><div class="mb">${html}</div><div class="mf"></div></div>`;
  const close=()=>ov.remove();ov.querySelector('.mh button').onclick=close;
  ov.addEventListener('mousedown',e=>{if(e.target===ov)close();});
  const mf=ov.querySelector('.mf');
  buttons.forEach(b=>{const el=document.createElement('button');el.className='btn'+(b.primary?' primary':'')+(b.danger?' danger':'');el.textContent=b.label;el.onclick=()=>{if(b.action&&b.action(ov)===false)return;close();};mf.appendChild(el);});
  document.body.appendChild(ov);if(window.innerWidth>860)setTimeout(()=>ov.querySelector('.mb input,.mb select,.mb textarea')?.focus(),50);return ov;
}
function optList(f){return(typeof f.options==='function'?f.options():f.options).map(o=>Array.isArray(o)?o:[o,o]);}
function field(f,v){
  v=v??f.default??'';const req=f.required?' <span class="req">*</span>':'';const cls='fg'+(f.full||f.type==='textarea'?' full':'');
  let inp;
  if(f.type==='select')inp=`<select name="${f.name}">${f.placeholder!==undefined?`<option value="">${esc(f.placeholder)}</option>`:''}${optList(f).map(([k,l])=>`<option value="${esc(k)}" ${String(k)===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  else if(f.type==='textarea')inp=`<textarea name="${f.name}">${esc(v)}</textarea>`;
  else inp=`<input name="${f.name}" type="${f.type||'text'}" value="${esc(v)}" ${f.step?`step="${f.step}"`:''} ${f.list?`list="${f.name}_dl"`:''} placeholder="${esc(f.ph||'')}" ${f.type==='number'?'inputmode="decimal"':''}>${f.list?`<datalist id="${f.name}_dl">${f.list().map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:''}`;
  return `<div class="${cls}" data-f="${f.name}"><label>${esc(f.label)}${req}</label>${inp}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</div>`;
}
function form({title,fields,data={},onSave,size,onRender}){
  const ov=modal(title,`<form class="form-grid" onsubmit="return false">${fields.map(f=>field(f,data[f.name])).join('')}</form>`,[
    {label:'Cancelar'},
    {label:'Salvar',primary:true,action:ov=>{
      const o={};for(const f of fields){const el=ov.querySelector(`[name="${f.name}"]`);let v=el.value.trim();if(f.type==='number'&&v!=='')v=+v.replace(',','.');
        if(f.required&&(v===''||v==null)){el.focus();el.style.borderColor='#c0392b';toast('Preencha: '+f.label);return false;}o[f.name]=v;}
      return onSave(o);}}
  ],size);
  if(onRender)onRender(ov);return ov;
}

  const ev=[...db.events].sort((a,b)=>b.data.localeCompare(a.data)).slice(0,5);

};

    onSave:o=>{
      if(db.animals.some(x=>x.brinco.toLowerCase()===o.brinco.toLowerCase()&&x.id!==id)){toast('Já existe um animal com este brinco');return false;}
      if(a)Object.assign(a,o);else{const n={id:uid(),...o};db.animals.push(n);
        if(+o.valorCompra>0&&confirm(`Lançar a compra (${money2(o.valorCompra)}) como despesa no Financeiro?`))db.finance.push({id:uid(),tipo:'Despesa',categoria:'Compra de animais',data:o.dataEntrada,descricao:'Compra do animal '+o.brinco,valor:+o.valorCompra,pago:'Sim',animalId:n.id});}
      save();render();toast(a?'Animal atualizado':'Animal cadastrado');}});

function excluirAnimal(id){const a=animal(id);if(!confirm(`Excluir o animal ${a.brinco} e todo o seu histórico (pesagens, sanidade, reprodução e ocorrências)?`))return;
  db.animals=db.animals.filter(x=>x.id!==id);db.weighings=db.weighings.filter(x=>x.animalId!==id);db.health=db.health.filter(x=>x.animalId!==id);db.events=db.events.filter(x=>x.animalId!==id);db.repro=db.repro.filter(x=>x.femeaId!==id);save();document.querySelector('.ov')?.remove();render();toast('Animal excluído');}
function venderAnimal(id){
  const a=animal(id);const w=lastW(id);
  const est=p=>p?money(p*db.config.rendimento/100/15*db.config.precoArroba):'—';
  form({title:'Registrar venda – '+animalLabel(a),data:{data:today(),peso:w?.peso||''},fields:[
    {name:'data',label:'Data da venda',type:'date',required:true},{name:'peso',label:'Peso na venda (kg)',type:'number',step:'0.1'},
    {name:'valor',label:'Valor recebido (R$)',type:'number',step:'0.01',required:true,hint:'Estimativa pelo preço da arroba: '+est(w?.peso)},
    {name:'comprador',label:'Comprador / Destino',ph:'Ex.: Frigorífico X'},{name:'obs',label:'Observações',type:'textarea'}],
    onRender:ov=>{const p=ov.querySelector('[name=peso]');p.oninput=()=>ov.querySelector('[data-f=valor] .hint').textContent='Estimativa pelo preço da arroba: '+est(+p.value);},
    onSave:o=>{a.status='Vendido';a.dataSaida=o.data;

      db.finance.push({id:uid(),tipo:'Receita',categoria:'Venda de animais',data:o.data,descricao:`Venda do animal ${a.brinco}${o.comprador?' – '+o.comprador:''}`,valor:+o.valor,pago:'Sim',animalId:id});
      db.events.push({id:uid(),data:o.data,categoria:'Venda',animalId:id,descricao:`Vendido${o.comprador?' para '+o.comprador:''} por ${money2(o.valor)}${o.peso?' com '+nf(o.peso,1)+' kg':''}.${o.obs?'\n'+o.obs:''}`});
      save();document.querySelector('.ov')?.remove();render();toast('Venda registrada');}});
}

      <td class="acts"><button class="btn sm" onclick="formPesagem('${a.id}')" title="Pesar">⚖️</button> <button class="btn sm" onclick="formSanidade('${a.id}')" title="Sanidade">💉</button> <button class="btn sm" onclick="formAnimal('${a.id}')" title="Editar">✏️</button> <button class="btn sm" onclick="verAnimal('${a.id}')">Ficha</button></td></tr>`;}).join('')}</tbody></table>`:'<div class="empty">Nenhum animal encontrado</div>';};
  $('#q').oninput=e=>{fA.q=e.target.value;draw();};$('#fp').onchange=e=>{fA.pasto=e.target.value;draw();};$('#fs').onchange=e=>{fA.status=e.target.value;draw();};$('#fx').onchange=e=>{fA.sexo=e.target.value;draw();};

function verAnimal(id){
  const a=animal(id);const ws=weightsOf(id);const w=ws[ws.length-1];const g=gmd(id);
  const hs=db.health.filter(h=>h.animalId===id).sort((x,y)=>y.data.localeCompare(x.data));
  const es=db.events.filter(e=>e.animalId===id).sort((x,y)=>y.data.localeCompare(x.data));
  const fin=db.finance.filter(f=>f.animalId===id).sort((x,y)=>y.data.localeCompare(x.data));
  const ganho=ws.length>1?ws[ws.length-1].peso-ws[0].peso:null;
  const recA=fin.filter(f=>f.tipo==='Receita').reduce((s,f)=>s+(+f.valor||0),0);
  const despA=fin.filter(f=>f.tipo==='Despesa').reduce((s,f)=>s+(+f.valor||0),0)+(fin.some(f=>f.categoria==='Compra de animais')?0:(+a.valorCompra||0));
  const isF=a.sexo==='Fêmea';const sr=isF?statusRepro(id):null;
  const html=`<div class="dgrid">
    <div><span>Brinco</span><b>${esc(a.brinco)}</b></div><div><span>Nome</span><b>${esc(a.nome||'—')}</b></div><div><span>Situação</span><b>${statusTag(a.status)}</b></div><div><span>Categoria</span><b>${categoria(a)}</b></div>
    <div><span>Sexo</span><b>${esc(a.sexo)}${a.castrado==='Sim'?' (castrado)':''}</b></div><div><span>Raça</span><b>${esc(a.raca||'—')}</b></div><div><span>Nascimento</span><b>${fd(a.nasc)} (${idadeTxt(a)})</b></div><div><span>Pasto</span><b>${esc(pastoNome(a.pastoId))}</b></div>
    <div><span>Peso atual</span><b>${w?nf(w.peso,1)+' kg':'—'}</b></div><div><span>Ganho total</span><b>${ganho!=null?nf(ganho,1)+' kg':'—'}</b></div><div><span>GMD</span><b>${g!=null?nf(g,3)+' kg/dia':'—'}</b></div><div><span>Arrobas est.</span><b>${w?nf(w.peso*db.config.rendimento/100/15,1)+' @':'—'}</b></div>
    <div><span>Entrada</span><b>${fd(a.dataEntrada)}</b></div><div><span>Origem</span><b>${esc(a.origem||'—')}</b></div><div><span>Mãe / Pai</span><b>${esc(a.mae||'—')} / ${esc(a.pai||'—')}</b></div>
    <div><span>${a.status==='Vendido'?'Resultado':'Custo direto'}</span><b class="${a.status==='Vendido'?(recA-despA>=0?'pos':'neg'):''}">${a.status==='Vendido'?money(recA-despA):money(despA)}</b></div>
    ${isF?`<div><span>Status reprodutivo</span><b>${reproTag(sr.st)}</b></div><div><span>Previsão de parto</span><b>${fd(sr.previsao)}</b></div><div><span>Nº de partos</span><b>${sr.partos}</b></div><div><span>Intervalo entre partos</span><b>${sr.iep?nf(sr.iep,0)+' dias':'—'}</b></div>`:''}
  </div>
  ${a.obs?`<div class="aitem" style="margin-bottom:14px"><div><b>Observações</b><div class="m" style="white-space:pre-wrap;color:#33443a">${esc(a.obs)}</div></div></div>`:''}
  <div class="card" style="box-shadow:none"><h3>📈 Curva de peso</h3><canvas id="cAn" class="sm"></canvas></div>
  <div class="sec-t">⚖️ Pesagens (${ws.length})</div>
  <div class="tbl-wrap" style="box-shadow:none">${ws.length?`<table><tr><th>Data</th><th>Peso</th><th>Variação</th><th>Dias</th><th>GMD no período</th><th></th></tr>${ws.map((x,i)=>{const p=ws[i-1];const d=p?days(p.data,x.data):null;return`<tr><td>${fd(x.data)}${x.entrada?' <span class="tag t-cinza">entrada</span>':''}</td><td><b>${nf(x.peso,1)} kg</b></td><td>${p?`<span class="${x.peso>=p.peso?'pos':'neg'}">${x.peso>=p.peso?'+':''}${nf(x.peso-p.peso,1)} kg</span>`:'—'}</td><td>${d??'—'}</td><td>${p&&d?gmdHtml((x.peso-p.peso)/d):'—'}</td><td class="acts">${x.id?`<button class="btn sm danger" onclick="excluirPesagem('${x.id}',true)">🗑</button>`:''}</td></tr>`;}).reverse().join('')}</table>`:'<div class="empty">Sem pesagens</div>'}</div>
  ${isF?`<div class="sec-t">🐮 Reprodução (${sr.ev.length})</div><div class="tbl-wrap" style="box-shadow:none">${sr.ev.length?`<table><tr><th>Data</th><th>Evento</th><th>Touro / Sêmen</th><th>Resultado</th><th>Estação</th><th></th></tr>${[...sr.ev].reverse().map(r=>`<tr><td>${fd(r.data)}</td><td>${esc(r.tipo)}</td><td>${esc(r.touro||'—')}</td><td>${r.resultado?reproTag(r.resultado):'—'}</td><td>${esc(db.stations.find(s=>s.id===r.estacaoId)?.nome||'—')}</td><td class="acts"><button class="btn sm danger" onclick="excluirRepro('${r.id}',true)">🗑</button></td></tr>`).join('')}</table>`:'<div class="empty">Sem registros reprodutivos</div>'}</div>`:''}
  <div class="sec-t">💉 Sanidade (${hs.length})</div>
  <div class="tbl-wrap" style="box-shadow:none">${hs.length?`<table><tr><th>Data</th><th>Tipo</th><th>Produto</th><th>Dose</th><th>Próxima</th><th>Responsável</th></tr>${hs.map(h=>`<tr><td>${fd(h.data)}</td><td>${tipoTag(h.tipo)}</td><td>${esc(h.produto)}</td><td>${esc(h.dose||'—')}</td><td>${fd(h.proxima)}</td><td>${esc(h.responsavel||'—')}</td></tr>`).join('')}</table>`:'<div class="empty">Sem registros sanitários</div>'}</div>
  ${fin.length?`<div class="sec-t">💰 Financeiro (${fin.length})</div><div class="tbl-wrap" style="box-shadow:none"><table><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th class="num">Valor</th></tr>${fin.map(f=>`<tr><td>${fd(f.data)}</td><td>${finTag(f.tipo)}</td><td>${esc(f.descricao||f.categoria)}</td><td class="num ${f.tipo==='Receita'?'pos':'neg'}">${money2(f.valor)}</td></tr>`).join('')}</table></div>`:''}
  <div class="sec-t">📝 Ocorrências (${es.length})</div>
  ${es.length?es.map(e=>`<div class="aitem" style="margin-bottom:6px"><span class="dot" style="background:${CATS[e.categoria]||'#64748b'}"></span><div><b>${esc(e.categoria)}</b> <span class="m">· ${fd(e.data)}</span><div class="m" style="white-space:pre-wrap;color:#33443a">${esc(e.descricao)}</div></div></div>`).join(''):'<div class="empty">Sem ocorrências</div>'}`;
  const bts=[{label:'🗑 Excluir',danger:true,action:()=>{excluirAnimal(id);return false;}},
    {label:'📝 Ocorrência',action:()=>{setTimeout(()=>formEvento(id));}},
    {label:'💉 Sanidade',action:()=>{setTimeout(()=>formSanidade(id));}}];
  if(isF&&a.status==='Ativo')bts.push({label:'🐮 Reprodução',action:()=>{setTimeout(()=>formRepro(id));}});
  if(a.status==='Ativo')bts.push({label:'💰 Vender',action:()=>{setTimeout(()=>venderAnimal(id));}});
  bts.push({label:'⚖️ Pesar',action:()=>{setTimeout(()=>formPesagem(id));}},{label:'✏️ Editar',primary:true,action:()=>{setTimeout(()=>formAnimal(id));}});
  modal('Ficha do animal – '+animalLabel(a),html,bts,'lg');
  requestAnimationFrame(()=>lineChart($('#cAn'),ws.map(x=>fd(x.data).slice(0,5)+'/'+x.data.slice(2,4)),ws.map(x=>x.peso)));
}

    {name:'animalId',label:'Animal',type:'select',required:true,placeholder:'Selecione...',full:true,options:()=>ativos().sort(byBrinco).map(a=>[a.id,animalLabel(a)+' · último: '+(lastW(a.id)?nf(lastW(a.id).peso,0)+' kg':'—')])},

const SERV=['Cobertura (monta natural)','Inseminação (IA)','IATF'];
const DIAG='Diagnóstico de gestação';
const REPRO=[...SERV,DIAG,'Parto','Aborto'];
const GEST=290;
const RST={'Prenhe':'t-verde','Coberta':'t-azul','Vazia':'t-verm','Parida':'t-roxo','Sem registro':'t-cinza'};
const reproTag=s=>`<span class="tag ${RST[s]||'t-cinza'}">${esc(s)}</span>`;
const femeas=()=>ativos().filter(a=>a.sexo==='Fêmea'&&(idadeMeses(a)==null||idadeMeses(a)>=12)).sort(byBrinco);
function statusRepro(fid){
  const ev=db.repro.filter(r=>r.femeaId===fid).sort((a,b)=>a.data.localeCompare(b.data));
  const s={st:'Sem registro',ev};const partos=[];let prevManual=null;
  ev.forEach(e=>{
    if(SERV.includes(e.tipo)){s.st='Coberta';s.servico=e.data;s.touro=e.touro;prevManual=null;}
    else if(e.tipo===DIAG){s.st=e.resultado==='Prenhe'?'Prenhe':'Vazia';s.diag=e.data;if(e.previsaoParto)prevManual=e.previsaoParto;}
    else if(e.tipo==='Parto'){s.st='Parida';partos.push(e.data);s.servico=null;prevManual=null;}
    else if(e.tipo==='Aborto'){s.st='Vazia';s.servico=null;prevManual=null;}
  });
  s.partos=partos.length;s.ultimoParto=partos[partos.length-1];
  if(partos.length>1){let t=0;for(let i=1;i<partos.length;i++)t+=days(partos[i-1],partos[i]);s.iep=t/(partos.length-1);}
  if(s.st==='Prenhe'){s.previsao=prevManual||(s.servico?addDays(s.servico,GEST):null);if(s.servico)s.diasGest=days(s.servico,today());}
  if(s.st==='Coberta'&&s.servico)s.diasServ=days(s.servico,today());
  return s;
}
function estacaoAtual(){const t=today();return db.stations.find(s=>s.inicio<=t&&(!s.fim||s.fim>=t))||[...db.stations].sort((a,b)=>b.inicio.localeCompare(a.inicio))[0];}
function stationStats(st){
  const rs=db.repro.filter(r=>r.estacaoId===st.id);const exp=new Set(rs.filter(r=>SERV.includes(r.tipo)).map(r=>r.femeaId));
  const diag={};rs.filter(r=>r.tipo===DIAG).sort((a,b)=>a.data.localeCompare(b.data)).forEach(r=>{diag[r.femeaId]=r.resultado;exp.add(r.femeaId);});
  const prenhes=Object.values(diag).filter(v=>v==='Prenhe').length,vazias=Object.values(diag).filter(v=>v==='Vazia').length;
  return{expostas:exp.size,prenhes,vazias,aguardando:exp.size-prenhes-vazias,taxa:prenhes+vazias?prenhes/(prenhes+vazias):null,servicos:rs.filter(r=>SERV.includes(r.tipo)).length};
}
function reproAlertas(){
  const out=[];const fs=femeas().map(f=>({f,s:statusRepro(f.id)}));
  const partos=fs.filter(o=>o.s.st==='Prenhe'&&o.s.previsao&&days(today(),o.s.previsao)<=30).sort((a,b)=>a.s.previsao.localeCompare(b.s.previsao));

  const ag=fs.filter(o=>o.s.st==='Coberta'&&o.s.diasServ>=30);
  if(ag.length)out.push({cor:'#2563eb',html:`<b>${ag.length} fêmea(s) aguardando diagnóstico de gestação</b><div class="m">Cobertas há mais de 30 dias: ${ag.slice(0,6).map(o=>esc(o.f.brinco)).join(', ')}${ag.length>6?'…':''}</div>`});
  return out;
}

const SKEY='gestao_rebanho_sync';
let sync={};try{sync=JSON.parse(localStorage.getItem(SKEY)||'{}');}catch(e){}
const saveSync=()=>localStorage.setItem(SKEY,JSON.stringify(sync));
const SQL=`create table if not exists public.fazenda_dados (
  user_id uuid primary key references auth.users(id) on delete cascade,
  dados jsonb not null,
  updated_at timestamptz not null default now()
);
alter table public.fazenda_dados enable row level security;
create policy "dono le" on public.fazenda_dados for select using (auth.uid() = user_id);
create policy "dono insere" on public.fazenda_dados for insert with check (auth.uid() = user_id);
create policy "dono altera" on public.fazenda_dados for update using (auth.uid() = user_id);`;
const sbBase=()=>(sync.url||'').trim().replace(/\/+$/,'');
async function sbAuth(path,body){
  const r=await fetch(sbBase()+'/auth/v1/'+path,{method:'POST',headers:{apikey:sync.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(traduzErro(j.error_description||j.msg||j.message||j.error||('Erro '+r.status)));return j;
}
function traduzErro(m){const t={'Invalid login credentials':'E-mail ou senha incorretos','Email not confirmed':'E-mail ainda não confirmado. Abra o e-mail do Supabase e confirme.','User already registered':'Este e-mail já tem conta. Use "Entrar".','Failed to fetch':'Sem conexão com o servidor. Verifique a internet e a URL.'};for(const k in t)if(String(m).includes(k))return t[k];return m;}
function setSession(j){sync.access=j.access_token;sync.refresh=j.refresh_token;sync.exp=Date.now()+((j.expires_in||3600)-60)*1000;sync.uid=j.user.id;sync.email=j.user.email;saveSync();}
async function sbToken(){if(!sync.refresh)throw new Error('Não conectado');if(!sync.access||Date.now()>sync.exp)setSession(await sbAuth('token?grant_type=refresh_token',{refresh_token:sync.refresh}));return sync.access;}
async function sbRest(method,q,body){
  const t=await sbToken();
  const r=await fetch(sbBase()+'/rest/v1/fazenda_dados'+q,{method,headers:{apikey:sync.key,Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:body?JSON.stringify(body):undefined});
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(traduzErro(j.message||('Erro '+r.status)));}
  return method==='GET'?r.json():null;
}
function mergeDb(a,b){
  const out={...a,deleted:{...(b.deleted||{})}};
  for(const[k,v]of Object.entries(a.deleted||{}))out.deleted[k]=Math.max(v,out.deleted[k]||0);
  for(const c of COLS){const m=new Map();[...(a[c]||[]),...(b[c]||[])].forEach(r=>{const o=m.get(r.id);if(!o||(r._u||0)>(o._u||0))m.set(r.id,r);});
    out[c]=[...m.values()].filter(r=>!(out.deleted[r.id]>=(r._u||0)));}
  out.config=((b.config?._u||0)>(a.config?._u||0))?b.config:a.config;
  return normalize(out);
}
let syncing=false,syncTimer=null;
function schedSync(){if(!sync.refresh)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),2500);}
function setSyncStatus(s,msg){
  const txt={off:'Dados salvos neste aparelho.<br>Faça backup regularmente.',sync:'🔄 Sincronizando...',ok:'☁️ Sincronizado'+(sync.last?' às '+new Date(sync.last).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):''),offline:'📴 Sem internet. Os dados ficam salvos no aparelho e sincronizam depois.',erro:'⚠️ Erro na sincronização: '+esc(msg||'')};
  $('#syncSt').innerHTML=txt[s];
  $('#syncIco').innerHTML={off:'',sync:'🔄',ok:'☁️ ✓',offline:'📴 offline',erro:'⚠️ sync'}[s];$('#syncIco').title=msg||'';
}
async function syncNow(manual){
  if(!sync.refresh){setSyncStatus('off');return;}
  if(syncing)return;if(!navigator.onLine){setSyncStatus('offline');return;}
  syncing=true;setSyncStatus('sync');
  try{
    const rows=await sbRest('GET','?select=dados&user_id=eq.'+sync.uid);
    const remote=rows[0]?.dados;const merged=remote?mergeDb(db,remote):db;
    const mudouLocal=JSON.stringify(merged)!==JSON.stringify(db);
    if(mudouLocal){db=merged;localStorage.setItem(KEY,JSON.stringify(db));snapshot();}
    if(!remote||JSON.stringify(merged)!==JSON.stringify(normalize(remote)))await sbRest('POST','',{user_id:sync.uid,dados:merged,updated_at:new Date().toISOString()});
    sync.last=Date.now();saveSync();setSyncStatus('ok');
    if(mudouLocal&&!document.querySelector('.ov'))render();else updateBadges();
    if(manual){toast('Sincronização concluída');if(view==='config')render();}
  }catch(e){setSyncStatus('erro',e.message);if(manual)toast('Erro: '+e.message);}
  syncing=false;
}
async function entrarSync(criar){
  const f=$('#sf');const g=n=>f.querySelector(`[name=${n}]`).value.trim();
  sync.url=g('url');sync.key=g('key');const email=g('email'),senha=f.querySelector('[name=senha]').value;
  if(!/^https:\/\/.+/.test(sync.url)||!sync.key){toast('Informe a URL e a chave do Supabase');return;}
  if(!email||senha.length<6){toast('Informe e-mail e senha (mínimo 6 caracteres)');return;}
  saveSync();
  try{
    if(criar){const j=await sbAuth('signup',{email,password:senha});if(j.access_token)setSession(j);else{sync.email=email;saveSync();alert('Conta criada! Abra o e-mail enviado pelo Supabase, confirme o cadastro e depois clique em "Entrar".');return;}}
    else setSession(await sbAuth('token?grant_type=password',{email,password:senha}));
    toast('Conectado!');await syncNow(true);render();
  }catch(e){alert('Não foi possível conectar:\n'+e.message);}
}
function sairSync(){if(!confirm('Desconectar a sincronização neste aparelho? Os dados continuam salvos aqui.'))return;delete sync.access;delete sync.refresh;delete sync.uid;saveSync();setSyncStatus('off');render();}
function copiarSQL(){navigator.clipboard.writeText(SQL).then(()=>toast('Código copiado'),()=>toast('Selecione o texto e copie manualmente'));}
setInterval(()=>syncNow(),60000);
window.addEventListener('online',()=>syncNow());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow();});

function download(name,content,type){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function exportJSON(){download(`backup-rebanho-${today()}.json`,JSON.stringify(db,null,1),'application/json');toast('Backup baixado');}

function carregarExemplo(){
  if(db.animals.length&&!confirm('Isto vai adicionar dados de exemplo aos dados existentes. Continuar?'))return;
  const R=(a,b)=>a+Math.random()*(b-a);const pick=l=>l[Math.floor(Math.random()*l.length)];const T=today();
  const ps=[{id:uid(),nome:'Pasto da Represa',area:32,capacidade:40,forrageira:'Brachiaria brizantha (Marandu)',condicao:'Boa',agua:'Represa'},
    {id:uid(),nome:'Pasto do Morro',area:25,capacidade:30,forrageira:'Panicum (Mombaça)',condicao:'Ótima',agua:'Bebedouro'},
    {id:uid(),nome:'Piquete Maternidade',area:8,capacidade:12,forrageira:'Tifton 85',condicao:'Regular',agua:'Bebedouro'}];
  db.pastures.push(...ps);
  const nomes=['Trovão','Valente','Pintado','Faísca','Barão','Sultão','Bandido','Moreno','Estrela','Mimosa','Pretinha','Princesa','Boneca','Jóia','Duque','Tufão','Cigano','Fumaça','Rajado','Malhada','Serena','Branquinha','Xodó','Brasão'];
  const racas=['Nelore','Nelore','Nelore','Aberdeen x Nelore','Brahman','Senepol','Tabapuã'];
  const ent=addDays(T,-182);const fems=[];let compra=0;
  nomes.forEach((n,i)=>{const f=i>=8&&i<13||i>=19&&i<22;const a={id:uid(),brinco:String(100+i*3).padStart(4,'0'),nome:n,sexo:f?'Fêmea':'Macho',castrado:f?'Não':(i%3?'Sim':'Não'),raca:pick(racas),pelagem:pick(['Branca','Cinza','Vermelha','Preta']),
      nasc:addDays(T,-Math.round(f?R(500,1600):R(330,900))),origem:i<18?'Compra':'Nascido na fazenda',dataEntrada:ent,pesoEntrada:Math.round(R(230,330)),valorCompra:Math.round(R(2400,3600)),
      pastoId:f&&i<11?ps[2].id:ps[i%2].id,status:i===23?'Vendido':'Ativo',obs:''};
    if(a.status==='Vendido')a.dataSaida=addDays(T,-10);db.animals.push(a);if(f)fems.push(a);compra+=a.valorCompra;
    const gd=R(.45,.95);let p=a.pesoEntrada;
    for(let k=1;k<=6;k++){const d=addDays(ent,k*30);p+=30*gd*R(.75,1.25)-(i===5&&k===6?40:0);db.weighings.push({id:uid(),animalId:a.id,data:d,peso:Math.round(p*10)/10});}
    db.health.push({id:uid(),animalId:a.id,tipo:'Vacina',produto:'Clostridioses (Polivalente)',data:addDays(ent,2),dose:'5 ml SC',proxima:addDays(ent,32),responsavel:'José'});
    db.health.push({id:uid(),animalId:a.id,tipo:'Vacina',produto:'Clostridioses (Polivalente)',data:addDays(ent,32),dose:'5 ml SC',proxima:addDays(T,190),responsavel:'José'});
    db.health.push({id:uid(),animalId:a.id,tipo:'Vermífugo',produto:'Ivermectina',data:addDays(T,-85),dose:'1 ml/50kg SC',proxima:addDays(T,5),carencia:35,responsavel:'José'});
    if(a.pastoId===ps[1].id)db.health.push({id:uid(),animalId:a.id,tipo:'Carrapaticida',produto:'Fipronil',data:addDays(T,-25),dose:'Pour-on',proxima:addDays(T,-2),responsavel:'Pedro'});
    if(f)db.health.push({id:uid(),animalId:a.id,tipo:'Vacina',produto:'Raiva',data:addDays(T,-120),proxima:addDays(T,245),responsavel:'Veterinário'});
  });
  const A=db.animals;
  // Reprodução
  const est={id:uid(),nome:'Estação '+(new Date().getFullYear()),inicio:addDays(T,-150),fim:addDays(T,-60),touros:'Barão (0112), Sêmen Angus',meta:85,protocolo:'IATF + repasse com touro'};db.stations.push(est);
  fems.forEach((f,k)=>{
    if(k===0){db.repro.push({id:uid(),femeaId:f.id,tipo:'Parto',data:addDays(T,-640),obs:'Parto normal'},{id:uid(),femeaId:f.id,tipo:'Inseminação (IA)',data:addDays(T,-255),touro:'Sêmen Angus'},{id:uid(),femeaId:f.id,tipo:DIAG,data:addDays(T,-200),resultado:'Prenhe'});return;}
    if(k===1){db.repro.push({id:uid(),femeaId:f.id,tipo:'Parto',data:addDays(T,-800)},{id:uid(),femeaId:f.id,tipo:'Parto',data:addDays(T,-390)});}
    db.repro.push({id:uid(),femeaId:f.id,tipo:'IATF',data:addDays(T,-140),touro:'Sêmen Angus',estacaoId:est.id});
    if(k<7)db.repro.push({id:uid(),femeaId:f.id,tipo:DIAG,data:addDays(T,-100),resultado:k%5===3?'Vazia':'Prenhe',estacaoId:est.id});
    if(k===7)db.repro.push({id:uid(),femeaId:f.id,tipo:'Cobertura (monta natural)',data:addDays(T,-45),touro:'Barão (0112)',estacaoId:est.id});
  });
  // Financeiro
  const fin=(tipo,categoria,data,descricao,valor,extra={})=>db.finance.push({id:uid(),tipo,categoria,data,descricao,valor:Math.round(valor*100)/100,pago:'Sim',...extra});
  fin('Despesa','Compra de animais',ent,'Compra de lote de 18 garrotes e 6 novilhas',compra,{fornecedor:'Leilão Regional'});
  fin('Despesa','Frete',ent,'Frete do lote comprado',1850,{fornecedor:'Transportadora Boi Bom'});
  for(let m=0;m<6;m++){const d=addDays(ent,15+m*30);
    fin('Despesa','Mão de obra',addDays(ent,28+m*30),'Salário do vaqueiro',2600,{forma:'PIX'});
    fin('Despesa','Sal mineral / Suplemento',d,`${Math.round(R(14,22))} sacos de sal mineral`,R(1500,2300),{fornecedor:'Agropecuária Central'});
    fin('Despesa','Combustível',addDays(d,5),'Diesel do trator e da caminhonete',R(500,900));}
  fin('Despesa','Medicamentos e vacinas',addDays(ent,2),'Vacina clostridiose + seringas',640);
  fin('Despesa','Medicamentos e vacinas',addDays(T,-85),'Ivermectina (frasco 500 ml)',420);
  fin('Despesa','Veterinário',addDays(T,-100),'Diagnóstico de gestação (ultrassom)',560,{fornecedor:'Dr. Carlos'});
  fin('Despesa','Manutenção (cercas, máquinas)',addDays(T,-6),'Conserto de cerca – 15 mourões e arame',620);
  fin('Despesa','Pastagem / Adubação',addDays(T,-70),'Adubação do Pasto do Morro',4800,{pastoId:ps[1].id});
  fin('Despesa','Energia elétrica',addDays(T,3),'Conta de energia',380,{pago:'Não',vencimento:addDays(T,3)});
  fin('Receita','Venda de animais',addDays(T,-10),'Venda do animal '+A[23].brinco+' – Frigorífico Vale',4150,{animalId:A[23].id,fornecedor:'Frigorífico Vale'});
  fin('Receita','Arrendamento recebido',addDays(T,-40),'Arrendamento de 10 ha para vizinho',2500);
  fin('Receita','Venda de bezerros',addDays(T,12),'Venda de 4 bezerros (a receber)',7600,{pago:'Não',vencimento:addDays(T,12)});
  const ev=[
    [-1,'Observação','Rebanho do Pasto da Represa calmo, todos comendo bem. Cocho de sal reabastecido.',null,ps[0].id],
    [-2,'Doença / Tratamento','Animal mancando da pata traseira esquerda. Feita limpeza do casco e aplicado spray cicatrizante. Acompanhar.',A[5].id],
    [-3,'Alimentação / Suplementação','Iniciada suplementação proteica (0,1% PV) no Pasto do Morro.',null,ps[1].id],
    [-6,'Manutenção (cercas, cochos, água)','Consertada cerca na divisa com o vizinho (aprox. 120 m). Trocados 15 mourões.'],
    [-9,'Clima','Chuva de 45 mm. Pastos respondendo bem.'],
    [-10,'Venda','Vendido para o Frigorífico Vale.',A[23].id],
    [-20,'Manejo','Contagem geral do rebanho: tudo conforme. Pesagem mensal realizada.']];
  ev.forEach(e=>db.events.push({id:uid(),data:addDays(T,e[0]),categoria:e[1],descricao:e[2],animalId:e[3]||'',pastoId:e[4]||'',responsavel:'José'}));
  if(db.config.fazenda==='Minha Fazenda')db.config.fazenda='Fazenda Boa Vista';
  save();go('dashboard');toast('Dados de exemplo carregados');
}

go('dashboard');
if(sync.refresh)syncNow();else setSyncStatus('off');
</script>
